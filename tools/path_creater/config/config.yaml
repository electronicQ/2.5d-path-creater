# Default path planner config for the banfu2 map.
# Paths are relative to this file's directory.
map_yaml: ../../../map/pgm/banfu2.yaml
map_meta: banfu2.meta.yaml

# Demo start/goal inferred from high-gray traversable cells in banfu2.pgm.
start:
  latitude: 22.39298349703113
  longitude: 113.30857557406419
  altitude: 38.19281114358455
goal:
  latitude: 22.395137269441996
  longitude: 113.3102750046435
  altitude: 38.18748848699033

unknown_gray: 205
absolute_obstacle_gray: 90
gray_cost:
  enabled: true
  weight: 1.0

inflation_radius_m: 2.0
d_safe_m: 6.0
smooth_paths: true

curve_smoothing:
  enabled: true
  sample_interval_m: 1.0
  corner_cut_fraction: 0.35
  max_corner_cut_m: 8.0
  min_corner_cut_m: 0.2
  safety_check_step_m: 0.25

planners:
  distance:
    w_turn: 0.0
    w_clear: 1.0
    w_gray: 0.5
  smooth:
    w_turn: 4.0
    w_clear: 2.0
    w_gray: 1.0
  cost_aware:
    w_turn: 0.5
    w_clear: 12.0
    w_gray: 35.0

output_dir: ../../../output
write_overlay: true
write_resolved_config: true
